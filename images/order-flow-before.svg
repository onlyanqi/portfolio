<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img" aria-labelledby="title desc">
<title id="title">Before: separate writes and unsafe retries</title><desc id="desc">CloudFront to API Gateway to intake Lambda. Separate DynamoDB save and SNS publish leave a failure gap. SNS to SQS to consumer Lambda to DynamoDB projection; a lost acknowledgement can repeat the update.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#82708e" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#39323f}.node{font-size:16px;font-weight:600}.sub{font-size:13px;fill:#63586d}.note{font-size:14px;fill:#8b495c}.good{font-size:14px;fill:#38635f}</style>
<rect x="25" y="20" width="180" height="48" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="115.0" y="49.0" text-anchor="middle" class="node">CloudFront</text><rect x="275" y="20" width="180" height="48" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="365.0" y="49.0" text-anchor="middle" class="node">API Gateway</text><path d="M205 44H275" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M365 68V90H240V112" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="112" width="200" height="48" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="240.0" y="141.0" text-anchor="middle" class="node">Intake Lambda</text><path d="M195 160V200H125V224" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M285 160V200H355V224" fill="none" stroke="#82708e" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="25" y="224" width="200" height="68" rx="8" fill="#e4edf0" stroke="#b8acbf"/><text x="125.0" y="249" text-anchor="middle" class="node">DynamoDB</text><text x="125.0" y="270" text-anchor="middle" class="sub">Order saved</text><rect x="255" y="224" width="200" height="68" rx="8" fill="#f0e4ee" stroke="#b8acbf"/><text x="355.0" y="249" text-anchor="middle" class="node">SNS</text><text x="355.0" y="270" text-anchor="middle" class="sub">Publish separately</text><text x="125" y="322" text-anchor="middle" class="sub">Write succeeds.</text><text x="355" y="322" text-anchor="middle" class="note">Publish can be lost.</text><rect x="32" y="355" width="194" height="88" rx="8" fill="#f7e5e9" stroke="#d7aab6"/><text x="129" y="382" text-anchor="middle" class="note">THE GAP</text><text x="129" y="405" text-anchor="middle" class="sub">No durable record of</text><text x="129" y="424" text-anchor="middle" class="sub">an unfinished publish.</text><path d="M355 292V370" fill="none" stroke="#82708e" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="255" y="370" width="200" height="58" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="355.0" y="395" text-anchor="middle" class="node">SQS</text><text x="355.0" y="416" text-anchor="middle" class="sub">Fulfillment queue</text><path d="M355 428V475" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="255" y="475" width="200" height="58" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="355.0" y="500" text-anchor="middle" class="node">Consumer Lambda</text><text x="355.0" y="521" text-anchor="middle" class="sub">Process event</text><path d="M355 533V580" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="255" y="580" width="200" height="68" rx="8" fill="#e4edf0" stroke="#b8acbf"/><text x="355.0" y="605" text-anchor="middle" class="node">DynamoDB</text><text x="355.0" y="626" text-anchor="middle" class="sub">Update projection</text><path d="M255 615H55V505H255" fill="none" stroke="#82708e" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="137" y="555" text-anchor="middle" class="sub">Lost acknowledgement</text><text x="137" y="575" text-anchor="middle" class="sub">can repeat the update.</text><path d="M25 695H455" stroke="#ded1dc"/><text x="240" y="726" text-anchor="middle" class="note">Separate writes leave a failure window.</text><text x="240" y="750" text-anchor="middle" class="sub">Retries can repeat the database effect.</text></svg>