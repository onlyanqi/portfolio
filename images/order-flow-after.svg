<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img" aria-labelledby="title desc">
<title id="title">After: transactional outbox and idempotent consumer</title><desc id="desc">CloudFront to API Gateway to intake Lambda. DynamoDB saves request, order and outbox atomically. Streams triggers relay Lambda to SNS, SQS and consumer Lambda. A second DynamoDB transaction saves receipt and projection together.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#82708e" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#39323f}.node{font-size:16px;font-weight:600}.sub{font-size:13px;fill:#63586d}.note{font-size:14px;fill:#8b495c}.good{font-size:14px;fill:#38635f}</style>
<rect x="25" y="20" width="180" height="48" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="115.0" y="49.0" text-anchor="middle" class="node">CloudFront</text><rect x="275" y="20" width="180" height="48" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="365.0" y="49.0" text-anchor="middle" class="node">API Gateway</text><path d="M205 44H275" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M365 68V90H240V112" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="112" width="200" height="48" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="240.0" y="141.0" text-anchor="middle" class="node">Intake Lambda</text><path d="M240 160V190" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="70" y="190" width="340" height="68" rx="8" fill="#e4edf0" stroke="#86aaa4"/><text x="240.0" y="215" text-anchor="middle" class="node">DynamoDB transaction</text><text x="240.0" y="236" text-anchor="middle" class="sub">Request + order + pending event</text><path d="M240 258V306" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="340" y="286" text-anchor="middle" class="sub">Outbox via Streams</text><rect x="140" y="306" width="200" height="48" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="240.0" y="335.0" text-anchor="middle" class="node">Relay Lambda</text><text x="240" y="377" text-anchor="middle" class="sub">Publish stored event ID; then mark sent.</text><path d="M240 385V402" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="402" width="200" height="44" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="240.0" y="429.0" text-anchor="middle" class="node">SNS</text><path d="M240 446V472" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="472" width="200" height="44" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="240.0" y="499.0" text-anchor="middle" class="node">SQS</text><path d="M240 516V542" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="140" y="542" width="200" height="48" rx="8" fill="#faf7f9" stroke="#b8acbf"/><text x="240.0" y="571.0" text-anchor="middle" class="node">Consumer Lambda</text><path d="M240 590V620" fill="none" stroke="#82708e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="70" y="620" width="340" height="68" rx="8" fill="#e4edf0" stroke="#86aaa4"/><text x="240.0" y="645" text-anchor="middle" class="node">DynamoDB transaction</text><text x="240.0" y="666" text-anchor="middle" class="sub">Receipt + projection update</text><path d="M25 710H455" stroke="#ded1dc"/><text x="240" y="739" text-anchor="middle" class="good">Durable intent. Repeat delivery, one effect.</text><text x="240" y="761" text-anchor="middle" class="sub">Database effect protected while receipts remain.</text></svg>