name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show basic info
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Listing files in repository root:"
          ls -la

      - name: Verify basic files exist
        run: |
          if [ -f README.md ]; then echo "README.md found"; else echo "README.md missing"; fi
          if [ -f .gitignore ]; then echo ".gitignore found"; else echo ".gitignore missing"; fi
