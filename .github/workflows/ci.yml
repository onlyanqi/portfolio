name: Validate portfolio
on:
  push:
    branches: [main, codex/portfolio-redesign]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local links and deployment paths
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: node --check script.js
